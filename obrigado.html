    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }

        .transition-container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-top-color: #25D366;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .whatsapp-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .countdown {
            font-size: 0.9rem;
            color: #999;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .transition-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 1.3rem;
            }

            p {
                font-size: 0.95rem;

        }
